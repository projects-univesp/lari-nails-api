services:
  postgres:
    image: postgres:18-alpine
    container_name: lari-nails-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lari_nails_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lari_nails_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lari-nails-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-lari-nails-api}:${VERSION:-latest}
    container_name: lari-nails-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lari_nails_db}?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lari-nails-net

networks:
  lari-nails-net:
    name: lari-nails-net

volumes:
  postgres_data:
    name: lari-nails-postgres-data
